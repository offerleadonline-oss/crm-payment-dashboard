const columns = ["Vendedor", "Supervisor", "Data Proposta", "Contrato", "CPF", "CNPJ", "Cidade Lista", "UF", "Forma de Pagamento", "DCC Banco", "DCC Conta", "DCC Agencia", "Netsales (forma de pagamento)"];

let filtered=[...data];
let currentPage=1;
let perPage=20;
let sortColumn=null;
let sortAsc=true;

const thead=document.getElementById('thead');
columns.forEach(col=>{
 const th=document.createElement('th');
 th.textContent=col;
 th.onclick=()=>sortBy(col);
 thead.appendChild(th);
});

function badge(v){
 const t=(v||'').toLowerCase();
 if(t.includes('boleto')) return `<span class="badge boleto">${v}</span>`;
 if(t.includes('descon')) return `<span class="badge descon">${v}</span>`;
 if(t.includes('conect')) return `<span class="badge conect">${v}</span>`;
 return v;
}

function render(){
 const start=(currentPage-1)*perPage;
 const pageData=filtered.slice(start,start+perPage);
 const tbody=document.getElementById('tbody');
 tbody.innerHTML='';
 pageData.forEach(r=>{
  const tr=document.createElement('tr');
  columns.forEach(c=>{
   const td=document.createElement('td');
   td.innerHTML = c==='Netsales (forma de pagamento)' ? badge(r[c]) : (r[c] ?? '');
   tr.appendChild(td);
  });
  tbody.appendChild(tr);
 });

 const totalPages=Math.max(1,Math.ceil(filtered.length/perPage));
 document.getElementById('pageInfo').textContent=`Página ${currentPage} de ${totalPages}`;
 document.getElementById('info').textContent=`${filtered.length} registros visíveis de ${data.length}`;
 document.getElementById('subtitle').textContent=`Total de registros: ${data.length}`;
}

function sortBy(col){
 if(sortColumn===col) sortAsc=!sortAsc;
 else{sortColumn=col;sortAsc=true;}
 filtered.sort((a,b)=>String(a[col]).localeCompare(String(b[col]),'pt-BR',{numeric:true})*(sortAsc?1:-1));
 render();
}

document.getElementById('search').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 filtered=data.filter(r=>columns.some(c=>String(r[c]||'').toLowerCase().includes(q)));
 currentPage=1;
 render();
});

document.getElementById('perPage').addEventListener('change',e=>{
 perPage=parseInt(e.target.value);
 currentPage=1;
 render();
});

document.getElementById('prev').onclick=()=>{
 if(currentPage>1){currentPage--;render();}
};

document.getElementById('next').onclick=()=>{
 const totalPages=Math.ceil(filtered.length/perPage);
 if(currentPage<totalPages){currentPage++;render();}
};

render();
</script>
